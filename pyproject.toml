[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glama"
version = "0.1.0"
description = "glama: OOM-safe local Ollama micro-agent & Telegram daemon for Mac (Unified RAM) and Windows/Linux (NVIDIA VRAM)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
glama = "glama.sandbox_agent:main"
glama-query = "glama.local_query:main"
glama-bot = "glama.telegram_bot:main"
glama-setup = "glama.setup_wizard:run_setup_wizard"
